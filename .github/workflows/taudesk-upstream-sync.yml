name: taudesk upstream sync
# tune: cron weekly Monday 06:17 UTC low-traffic; workflow file itself not evidence of execution per T9
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout taudesk branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: taudesk

      - name: Configure bot identity
        run: |
          git config user.name "taudesk-bot"
          git config user.email "taudesk-bot@users.noreply.github.com"

      - name: Add upstream (idempotent)
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git remote -v

      - name: Fetch upstream dev
        run: git fetch upstream dev

      - name: Merge-base hard gate (T1)
        run: |
          echo "Checking merge-base HEAD <-> upstream/dev"
          git merge-base HEAD upstream/dev
          echo "merge-base OK: $(git merge-base HEAD upstream/dev)"

      - name: Create sync branch + merge attempt
        run: |
          BRANCH="upstream-sync/${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"
          if ! git merge --no-commit --no-ff upstream/dev; then
            echo "::error::Merge conflict with upstream/dev — manual resolution required"
            git merge --abort || true
            exit 1
          fi
          git commit -m "chore(taudesk): merge upstream/dev into $BRANCH" --no-verify || echo "No new commit needed"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun turbo typecheck --continue

      - name: Test
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          GITHUB_ACTIONS: "false"

      - name: Create PR to taudesk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD
          gh pr create --base taudesk --title "chore(taudesk): sync upstream/dev ${{ github.run_id }}" --body "Automated upstream sync from anomalyco/opencode dev @ $(git rev-parse --short upstream/dev). Merge-base pre-merge: $(git merge-base HEAD~1 upstream/dev 2>/dev/null || git merge-base HEAD upstream/dev)." || echo "PR creation failed or already exists"
